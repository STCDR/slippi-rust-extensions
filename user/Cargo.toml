[package]
name = "slippi-user"
description = "Data models and helpers for user authentication status."
authors = [
    "Slippi Team",
    "Ryan McGrath <ryan@rymc.io>"
]
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["ishiiruka"]
ishiiruka = []
mainline = []
playback = []

[dependencies]
dolphin-integrations = { path = "../dolphin" }
slippi-gg-api = { path = "../slippi-gg-api" }

open = "5"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
ureq = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_System_Com"] }
